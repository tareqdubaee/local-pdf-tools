name: Build offline PWA
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Build deployment
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist/vendor/pdf-lib dist/vendor/ghostscript
          cp index.html compression-worker.js manifest.webmanifest icon.svg README.md dist/
          curl -fL --retry 3 https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js -o dist/vendor/pdf-lib/pdf-lib.min.js
          curl -fL --retry 3 https://cdn.jsdelivr.net/npm/@jspawn/ghostscript-wasm@0.0.2/gs.mjs -o dist/vendor/ghostscript/gs.mjs
          curl -fL --retry 3 https://cdn.jsdelivr.net/npm/@jspawn/ghostscript-wasm@0.0.2/gs.js -o dist/vendor/ghostscript/gs.js
          curl -fL --retry 3 https://cdn.jsdelivr.net/npm/@jspawn/ghostscript-wasm@0.0.2/gs.wasm -o dist/vendor/ghostscript/gs.wasm
          python3 - <<'PY'
          from pathlib import Path
          import urllib.parse
          p=Path('dist/index.html'); s=p.read_text()
          s=s.replace('https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js','./vendor/pdf-lib/pdf-lib.min.js')
          Path('dist/index.html').write_text(s)
          w=Path('dist/compression-worker.js').read_text()
          w=w.replace('https://cdn.jsdelivr.net/npm/@jspawn/ghostscript-wasm@0.0.2/gs.mjs','./vendor/ghostscript/gs.mjs').replace("'https://cdn.jsdelivr.net/npm/@jspawn/ghostscript-wasm@0.0.2/' + file","'./vendor/ghostscript/' + file")
          Path('dist/compression-worker.js').write_text(w)
          # Downloadable single HTML keeps PDF-lib and icon embedded. Compression worker is
          # created from the worker source at runtime so no companion worker file is required.
          standalone=s
          pdfjs=Path('dist/vendor/pdf-lib/pdf-lib.min.js').read_text()
          standalone=standalone.replace('<script src="./vendor/pdf-lib/pdf-lib.min.js"></script>','<script>'+pdfjs+'</script>')
          icon=Path('icon.svg').read_text().replace('\n',' ')
          data='data:image/svg+xml,'+urllib.parse.quote(icon,safe='')
          standalone=standalone.replace('href="icon.svg"','href="'+data+'"').replace('src="icon.svg"','src="'+data+'"')
          worker=Path('compression-worker.js').read_text()
          worker_literal=repr(worker)
          standalone=standalone.replace("worker=new Worker('compression-worker.js',{type:'module'});", "let workerSource="+worker_literal+";worker=new Worker(URL.createObjectURL(new Blob([workerSource],{type:'text/javascript'})),{type:'module'});")
          Path('dist/local-pdf-tools.html').write_text(standalone)
          PY
          cat > dist/sw.js <<'EOF'
          const CACHE='local-pdf-tools-v5';
          const SHELL=['./','./index.html','./compression-worker.js','./manifest.webmanifest','./icon.svg','./vendor/pdf-lib/pdf-lib.min.js','./vendor/ghostscript/gs.mjs','./vendor/ghostscript/gs.js','./vendor/ghostscript/gs.wasm'];
          self.addEventListener('install',e=>e.waitUntil(caches.open(CACHE).then(c=>c.addAll(SHELL)).then(()=>self.skipWaiting())));
          self.addEventListener('activate',e=>e.waitUntil(caches.keys().then(ks=>Promise.all(ks.filter(k=>k!==CACHE).map(k=>caches.delete(k)))).then(()=>self.clients.claim())));
          self.addEventListener('fetch',e=>{if(e.request.method!=='GET')return;e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request)))});
          EOF
          touch dist/.nojekyll
          test -s dist/local-pdf-tools.html
          grep -q 'Compression result' dist/local-pdf-tools.html
          grep -q 'workerSource' dist/local-pdf-tools.html
      - name: Publish gh-pages
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git checkout --orphan offline-pages
          git rm -rf .
          cp -a dist/. . && rm -rf dist
          git add -A
          git commit -m "Deploy Local PDF Tools"
          git push --force origin HEAD:gh-pages
